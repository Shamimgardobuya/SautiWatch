<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report Incident</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header">
                        <h2>Report Gender-Based Violence Incident</h2>
                    </div>
                    <div class="card-body">
                        <form method="post">
                            {% csrf_token %}
                            <div class="mb-3">
                                <label for="{{ form.victim_name.id_for_label }}" class="form-label">{{ form.victim_name.label }}</label>
                                {{ form.victim_name }}
                                <div class="form-text">{{ form.victim_name.help_text }}</div>
                            </div>
                            <div class="mb-3">
                                <label for="{{ form.location.id_for_label }}" class="form-label">{{ form.location.label }}</label>
                                {{ form.location }}
                            </div>
                            <div class="mb-3">
                                <label for="{{ form.region.id_for_label }}" class="form-label">{{ form.region.label }}</label>
                                {{ form.region }}
                            </div>
                            <div class="mb-3">
                                <label for="{{ form.incident_date.id_for_label }}" class="form-label">{{ form.incident_date.label }}</label>
                                {{ form.incident_date }}
                            </div>
                            <div class="mb-3">
                                <label for="{{ form.description.id_for_label }}" class="form-label">{{ form.description.label }}</label>
                                {{ form.description }}
                                <div class="form-text">{{ form.description.help_text }}</div>
                            </div>
                            <button type="submit" class="btn btn-primary">Submit Report</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
