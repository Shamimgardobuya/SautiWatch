<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Track Report</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h2>Track Your Report</h2>
                    </div>
                    <div class="card-body">
                        <form method="get">
                            <div class="mb-3">
                                <label for="tracking_id" class="form-label">Tracking ID</label>
                                <input type="text" class="form-control" id="tracking_id" name="tracking_id" value="{{ tracking_id }}" required>
                            </div>
                            <button type="submit" class="btn btn-primary">Track Report</button>
                        </form>
                        {% if report %}
                        <div class="mt-4">
                            <h4>Report Status</h4>
                            <p><strong>Tracking ID:</strong> {{ report.tracking_id }}</p>
                            <p><strong>Status:</strong> {{ report.get_status_display }}</p>
                            <p><strong>Urgency:</strong> {{ report.get_urgency_level_display }}</p>
                            <p><strong>Location:</strong> {{ report.location }}</p>
                            <p><strong>Incident Date:</strong> {{ report.incident_date }}</p>
                        </div>
                        {% endif %}
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
