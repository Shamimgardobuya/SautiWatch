{% for contact in supportcontact %}
  <div>
    <h2>{{ contact.name }}</h2>
    <p>Category: {{ contact.category }}</p>
    <p>Organization: {{ contact.organization }}</p>
    <p>Region: {{ contact.region }}</p>
    <p>Phone: {{ contact.phone_number }}</p>   
    <p>Email: {{ contact.email }}</p>
  </div>
{% endfor %}
